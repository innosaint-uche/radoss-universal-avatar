name: Universal Avatar CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify universal package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup optional MemU integration Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install the pinned real MemU SDK for integration tests
        run: python -m pip install -r scripts/requirements-memu.txt

      - name: Run tests
        env:
          NAAVOS_MEMU_TEST_PYTHON: python
        run: npm test

      - name: Install browser for the local Avatar journey
        run: npx playwright install --with-deps chromium

      - name: Verify local Avatar browser journey
        env:
          NAAVOS_MEMU_BROWSER_PYTHON: python
        run: npx playwright test

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: avatar-browser-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run public-package preflight
        run: node scripts/check-public-package.mjs

      - name: Review package contents
        run: npm pack --dry-run

  secrets-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan repository
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
