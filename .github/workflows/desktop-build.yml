name: Desktop build (unsigned)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            bundles: app,dmg
          - os: ubuntu-24.04
            bundles: deb,rpm
          - os: windows-2022
            bundles: msi
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build target sidecar
        run: npm run desktop:sidecar

      - name: Build unsigned Tauri bundle
        run: npx @tauri-apps/cli@latest build --ci --no-sign --bundles "${{ matrix.bundles }}"

      - name: Upload unsigned artifacts
        uses: actions/upload-artifact@v4
        with:
          name: universal-avatar-${{ matrix.os }}-unsigned
          path: desktop-setup/src-tauri/target/release/bundle/**
          if-no-files-found: error
