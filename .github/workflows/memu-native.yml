name: Native packaged MemU integration

on:
  pull_request:
    branches: [main]
    paths: ['lib/**', 'test/memu*', 'scripts/requirements-memu.txt', '.github/workflows/memu-native.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: MemU packaged runtime on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r scripts/requirements-memu.txt
      - run: npm run desktop:sidecar
      - run: node scripts/verify-packaged-sidecar.mjs
      - name: Test native executable with real MemU SDK and local fixture embeddings
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            export NAAVOS_MEMU_TEST_EXECUTABLE="$GITHUB_WORKSPACE/desktop-setup/src-tauri/binaries/radoss-setup-x86_64-pc-windows-msvc.exe"
          else
            export NAAVOS_MEMU_TEST_EXECUTABLE="$GITHUB_WORKSPACE/desktop-setup/src-tauri/binaries/radoss-setup-aarch64-apple-darwin"
          fi
          export NAAVOS_MEMU_TEST_PYTHON=python
          node --test test/memu-integration.test.mjs
