[package]
name = "radoss-universal-avatar"
version = "0.2.0"
description = "No-code desktop setup shell for the Radoss Universal Avatar"
authors = ["Radoss Agency"]
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]
